<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<style>
    body {
        background: #f5f7f9;
        font-family: 'Segoe UI', sans-serif;
    }

    /* ================= NAVBAR ================= */

    .navbar {
        height: 75px;
        background: #fff;
        box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
    }

    .menu-btn {
        width: 45px;
        height: 45px;
        border-radius: 50%;
    }

    .notification-btn {
        position: relative;
        font-size: 22px;
        color: #444;
        border: none;
        background: transparent;
    }

    .notification-dot {
        width: 10px;
        height: 10px;
        background: #22c55e;
        border-radius: 50%;
        position: absolute;
        top: 5px;
        right: 5px;
        border: 2px solid #fff;
    }

    .profile-img-small {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        object-fit: cover;
        border: 2px solid #22c55e;
    }

    .dropdown-toggle::after {
        margin-left: 8px;
    }

    /* ================= OFFCANVAS ================= */

    .offcanvas {
        width: 340px;
    }

    .profile-img {
        width: 110px;
        height: 110px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #22c55e;
    }

    .info-box {
        background: #fff;
        padding: 15px;
        border-radius: 12px;
        margin-bottom: 15px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    .info-box i {
        color: #22c55e;
        margin-right: 8px;
    }

    /* ================= CONTENT ================= */

    .dashboard {
        padding: 40px;
    }

    .card-demo {
        border: none;
        border-radius: 15px;
        background: #fff;
        box-shadow: 0 3px 10px rgba(0, 0, 0, .08);
        padding: 30px;
    }

    /* Sidebar */

    #sidebarMenu {
        width: 280px;
    }

    #sidebarMenu .list-group-item {

        padding: 16px 25px;
        border: none;
        font-size: 17px;
        transition: .3s;

    }

    #sidebarMenu .list-group-item:hover {

        background: #f1fdf5;
        color: #198754;

    }

    #sidebarMenu .active {

        border-radius: 10px;
        margin: 10px;
        color: #fff;

    }

    #sidebarMenu i {

        font-size: 18px;

    }

    /* Keep right side horizontal */
    .navbar .ms-auto {
        display: flex;
        align-items: center;
        flex-wrap: nowrap;
        gap: 12px;
    }

    /* Prevent profile button from breaking */
    .profile-btn,
    .btn-success {
        white-space: nowrap;
    }

    /* Tablet */
    @media (max-width:768px) {

        .btn-success {
            padding: 8px 14px;
            font-size: 14px;
        }

    }

    /* Mobile */
    @media (max-width:576px) {

        .btn-success span {
            display: none;
        }

        .btn-success {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-success i {
            margin: 0;
            font-size: 20px;
        }

    }

    body {
        background: #f7f9fb;
        font-family: "Segoe UI", sans-serif;
    }

    .dashboard-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        transition: .3s;
        height: 100%;
    }

    .dashboard-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .icon-box {
        width: 70px;
        height: 70px;
        background: #edf9ef;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
    }

    .icon-box i {
        font-size: 32px;
        color: #198754;
    }

    .card-title {
        color: #555;
        font-size: 18px;
        font-weight: 500;
        margin-bottom: 10px;
    }

    .card-value {
        color: #198754;
        font-size: 40px;
        font-weight: 700;
        margin-bottom: 15px;
    }

    .status {
        display: inline-flex;
        align-items: center;
        background: #edf9ef;
        color: #198754;
        padding: 7px 12px;
        border-radius: 30px;
        font-size: 14px;
        font-weight: 500;
        gap: 6px;
    }

    @media(max-width:768px) {

        .icon-box {
            width: 60px;
            height: 60px;
        }

        .icon-box i {
            font-size: 26px;
        }

        .card-title {
            font-size: 16px;
        }

        .card-value {
            font-size: 30px;
        }

    }

    .eco-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, .08);
        transition: .3s;
        overflow: hidden;
    }

    .eco-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
    }

    .eco-header {
        background: linear-gradient(90deg, #198754, #39b86f);
        color: #fff;
        padding: 18px;
    }

    .icon-circle {
        width: 70px;
        height: 70px;
        background: #e8f8ec;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto;
    }

    .icon-circle i {
        font-size: 34px;
        color: #198754;
    }

    .tip-title {
        font-size: 24px;
        font-weight: 700;
        margin-top: 18px;
    }

    .tip-text {
        color: #6c757d;
        line-height: 1.8;
        margin-top: 10px;
    }

    .tip-list {
        list-style: none;
        padding: 0;
        margin-top: 20px;
    }

    .tip-list li {
        margin-bottom: 12px;
        color: #555;
        font-size: 15px;
    }

    .tip-list i {
        color: #198754;
        margin-right: 10px;
    }

    .learn-btn {
        border-radius: 30px;
        padding: 10px 28px;
        font-weight: 600;
    }

    @media(max-width:768px) {

        .tip-title {
            font-size: 20px;
        }

        .tip-text {
            font-size: 14px;
        }

        .icon-circle {
            width: 60px;
            height: 60px;
        }

        .icon-circle i {
            font-size: 28px;
        }

    }

    .profile-card {
        border: none;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, .08);

        min-height: 843px;
    }

    .profile-card .card-body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 40px 25px;
    }

    .profile-image {
        width: 180px;
        height: 180px;
        object-fit: cover;
        border-radius: 50%;
        border: 4px solid #198754;
        padding: 4px;
        display: block;
        margin: 0 auto 20px;
    }

    .profile-card .btn {
        width: 160px;
    }

    .text-start {
        width: 100%;
    }

    @media (max-width:991px) {

        .profile-card {
            min-height: auto;
        }

        .profile-image {
            width: 150px;
            height: 150px;
        }

        .profile-card .btn {
            width: 150px;
        }

    }

    .card {
        border-radius: 20px;
    }

    .card-header {
        border-radius: 20px 20px 0 0 !important;
    }

    .form-control,
    .form-select {
        height: 55px;
        border-radius: 12px;
        border: 1px solid #ced4da;
        transition: .3s;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: #198754;
        box-shadow: 0 0 0 .2rem rgba(25, 135, 84, .15);
    }

    .form-label {
        margin-bottom: 8px;
        color: #555;
    }

    @media (max-width:768px) {

        .card-body {
            padding: 25px;
        }

        .form-control,
        .form-select {
            height: 50px;
            font-size: 15px;
        }

    }

    .profile-img {
        width: 150px;
        height: 150px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #198754;

        display: block;
        margin: 0 auto;
    }
</style>

<body>



    <nav class="navbar navbar-expand-lg">

        <div class="container-fluid">


            <div class="d-flex align-items-center">

                <button class="btn btn-light menu-btn me-3" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#sidebarMenu" aria-controls="sidebarMenu">

                    <i class="bi bi-list fs-4"></i>

                </button>

                <h3 class="text-success fw-bold m-0 d-none d-md-block">
                    EcoBin
                </h3>

            </div>





            <div class="ms-auto d-flex align-items-center flex-nowrap">

                <!-- Notification -->
                <button class="btn position-relative me-3 border-0 bg-transparent">
                    <i class="bi bi-bell fs-4"></i>

                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-success">
                        99+
                    </span>
                </button>

                <button class="btn btn-success d-flex align-items-center rounded-pill px-3 py-2"
                    data-bs-toggle="offcanvas" data-bs-target="#profileSidebar">

                    <i class="bi bi-person-circle fs-5 me-2"></i>

                    <span class="d-none d-md-inline">
                        Aditya Samudrawar
                    </span>

                </button>

            </div>





            </li>

            </ul>

        </div>

        </div>



    </nav>


    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMenu">

        <div class="offcanvas-header">

            <h4 class="text-success fw-bold">
                EcoBin
            </h4>

            <button class="btn-close" data-bs-dismiss="offcanvas">
            </button>

        </div>

        <div class="offcanvas-body p-0">

            <div class="list-group list-group-flush">

                <a href="#" class="list-group-item list-group-item-action active bg-success border-0">
                    <i class="bi bi-house-door me-2"></i>
                    Dashboard
                </a>



                <a href="myinventory.html" class="list-group-item list-group-item-action">
                    <i class="bi bi-box-seam me-2"></i>

                <a href="myewaste.html" class="list-group-item list-group-item-action">

                <a href="Sheduledpickup.html" class="list-group-item list-group-item-action">

                </a>



                <a href="Recyclingcenters.html" class="list-group-item list-group-item-action">

                </a>



                <a href="#" class="list-group-item list-group-item-action">
                    <i class="bi bi-gear me-2"></i>
                    Settings
                </a>

            </div>

        </div>

    </div>


    <div class="offcanvas offcanvas-end" tabindex="-1" id="profileSidebar">

        <div class="offcanvas-header">

            <h4 class="text-success fw-bold">

                EcoBin Profile

            </h4>

            <button class="btn-close" data-bs-dismiss="offcanvas">
            </button>

        </div>

        <div class="offcanvas-body text-center justify-content-center">

            <div class="text-center mb-3">
                <img src="AdityaProfile.jpeg" class="profile-img img-fluid" alt="Profile">
            </div>
            <h4>Aditya Samudrawar</h4>

            <p class="text-muted">
                EcoBin User
            </p>

            <hr>

            <div class="info-box text-start">

                <i class="bi bi-geo-alt-fill"></i>

                <strong>Address</strong>

                <p class="mb-0 mt-2">

                    Nashik, Maharashtra, India

                </p>

            </div>

            <div class="info-box text-start">

                <i class="bi bi-envelope-fill"></i>

                <strong>Email</strong>

                <p class="mb-0 mt-2">
                    samudrawaraditya@gmail.com
                </p>
            </div>

            <div class="info-box text-start">

                <i class="bi bi-telephone-fill"></i>

                <strong>Phone</strong>

                <p class="mb-0 mt-2">

                    +91 8767894430

                </p>

            </div>

            <button class="btn btn-success w-100 mt-3">

                <i class="bi bi-pencil-square me-2"></i>

                Edit Profile

            </button>

        </div>

    </div>




    <div class="container-fluid mt-4">
        <div class="row g-4">

            <!-- Left Sidebar -->
            <div class="col-lg-3 col-md-12">

                <!-- Sidebar Card -->
                <div class="card profile-card shadow-sm">

                    <div class="card-body text-center">

                        <img src="AdityaProfile.jpeg" class="profile-image mb-3" alt="Profile">

                        <label for="photoUpload" class="btn btn-outline-success btn-sm rounded-pill px-4 mt-2 w-100 ">
                            <i class="bi bi-camera-fill me-2"></i>
                            Change Photo
                        </label>

                        <input type="file" id="photoUpload" class="d-none" accept="image/*">

                        <hr>

                        <div class="text-start">



                        </div>
                        <!-- Save Button at Bottom -->
                        <div class="mt-auto d-grid pt-4 mb-5 ">
                            <button class="btn btn-success rounded-pill">
                                <i class="bi bi-save me-2"></i>
                                Save Profile
                            </button>
                        </div>


                    </div>

                </div>

            </div>

            <!-- Right Side -->
            <div class="col-lg-9">

                <!-- Personal Information Card -->
                <div class="card shadow-sm border-0 rounded-4 mb-4">

                    <!-- Header -->
                    <div class="card-header bg-success text-white py-3">
                        <h4 class="mb-0">
                            <i class="bi bi-person-fill me-2"></i>
                            Personal Information
                        </h4>
                    </div>

                    <!-- Body -->
                    <div class="card-body p-4">

                        <div class="row g-4">

                            <!-- First Name -->
                            <div class="col-lg-6">
                                <label class="form-label fw-semibold">
                                    First Name
                                </label>

                                <input type="text" class="form-control" placeholder="Enter First Name">
                            </div>

                            <!-- Last Name -->
                            <div class="col-lg-6">
                                <label class="form-label fw-semibold">
                                    Last Name
                                </label>

                                <input type="text" class="form-control" placeholder="Enter Last Name">
                            </div>

                            <!-- Email -->
                            <div class="col-lg-6">
                                <label class="form-label fw-semibold">
                                    Email Address
                                </label>

                                <input type="email" class="form-control" placeholder="example@gmail.com">
                            </div>

                            <!-- Phone -->
                            <div class="col-lg-6">
                                <label class="form-label fw-semibold">
                                    Phone Number
                                </label>

                                <input type="tel" class="form-control" placeholder="+91 8767894430">
                            </div>

                            <!-- Date of Birth -->
                            <div class="col-lg-6">
                                <label class="form-label fw-semibold">
                                    Date of Birth
                                </label>

                                <input type="date" class="form-control">
                            </div>

                            <!-- Gender -->
                            <div class="col-lg-6">
                                <label class="form-label fw-semibold">
                                    Gender
                                </label>

                                <select class="form-select">
                                    <option selected>Select Gender</option>
                                    <option>Male</option>
                                    <option>Female</option>
                                    <option>Other</option>
                                </select>
                            </div>

                        </div>

                    </div>

                </div>

                <!-- Address Information -->
                <div class="card shadow-sm border-0 rounded-4 mb-4">

                    <div class="card-header bg-success text-white py-3">
                        <h4 class="mb-0">
                            <i class="bi bi-geo-alt-fill me-2"></i>
                            Address Information
                        </h4>
                    </div>

                    <div class="card-body p-4">

                        <div class="row g-4">

                            <!-- Address -->
                            <div class="col-12">
                                <label class="form-label fw-semibold">
                                    Street Address
                                </label>

                                <input type="text" class="form-control" placeholder="Enter Street Address">
                            </div>

                            <!-- City -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    City
                                </label>

                                <input type="text" class="form-control" placeholder="Enter City">
                            </div>

                            <!-- State -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    State
                                </label>

                                <input type="text" class="form-control" placeholder="Enter State">
                            </div>

                            <!-- Pincode -->
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">
                                    PIN Code
                                </label>

                                <input type="text" class="form-control" placeholder="422101">
                            </div>



                        </div>

                    </div>

                </div>

            </div>
        </div>
    </div>






</body>
