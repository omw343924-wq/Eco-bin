<style>
     body {
            background: #f5f7f9;
            font-family: 'Segoe UI', sans-serif;
        }

        /* ================= NAVBAR ================= */

        .navbar {
            height: 75px;
            background: #fff;
            box-shadow: 0 2px 10px rgba(0, 0, 0, .08);
        }

        .menu-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
        }

        .notification-btn {
            position: relative;
            font-size: 22px;
            color: #444;
            border: none;
            background: transparent;
        }

        .notification-dot {
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            position: absolute;
            top: 5px;
            right: 5px;
            border: 2px solid #fff;
        }

        .profile-img-small {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #22c55e;
        }

        .dropdown-toggle::after {
            margin-left: 8px;
        }

        /* ================= OFFCANVAS ================= */

        .offcanvas {
            width: 340px;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #22c55e;
        }

        .info-box {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
        }

        .info-box i {
            color: #22c55e;
            margin-right: 8px;
        }

        /* ================= CONTENT ================= */

        .dashboard {
            padding: 40px;
        }

        .card-demo {
            border: none;
            border-radius: 15px;
            background: #fff;
            box-shadow: 0 3px 10px rgba(0, 0, 0, .08);
            padding: 30px;
        }

        /* Sidebar */

        #sidebarMenu {
            width: 280px;
        }

        #sidebarMenu .list-group-item {

            padding: 16px 25px;
            border: none;
            font-size: 17px;
            transition: .3s;

        }

        #sidebarMenu .list-group-item:hover {

            background: #f1fdf5;
            color: #198754;

        }

        #sidebarMenu .active {

            border-radius: 10px;
            margin: 10px;
            color: #fff;

        }

        #sidebarMenu i {

            font-size: 18px;

        }

        /* Keep right side horizontal */
        .navbar .ms-auto {
            display: flex;
            align-items: center;
            flex-wrap: nowrap;
            gap: 12px;
        }

        /* Prevent profile button from breaking */
        .profile-btn,
        .btn-success {
            white-space: nowrap;
        }

        /* Tablet */
        @media (max-width:768px) {

            .btn-success {
                padding: 8px 14px;
                font-size: 14px;
            }

        }

        /* Mobile */
        @media (max-width:576px) {

            .btn-success span {
                display: none;
            }

            .btn-success {
                width: 45px;
                height: 45px;
                border-radius: 50%;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }

            .btn-success i {
                margin: 0;
                font-size: 20px;
            }

        }

        body {
            background: #f7f9fb;
            font-family: "Segoe UI", sans-serif;
        }

        .dashboard-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
            transition: .3s;
            height: 100%;
        }

        .dashboard-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: #edf9ef;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .icon-box i {
            font-size: 32px;
            color: #198754;
        }

        .card-title {
            color: #555;
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .card-value {
            color: #198754;
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            background: #edf9ef;
            color: #198754;
            padding: 7px 12px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            gap: 6px;
        }

        @media(max-width:768px) {

            .icon-box {
                width: 60px;
                height: 60px;
            }

            .icon-box i {
                font-size: 26px;
            }

            .card-title {
                font-size: 16px;
            }

            .card-value {
                font-size: 30px;
            }

        }

        .eco-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .08);
            transition: .3s;
            overflow: hidden;
        }

        .eco-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
        }

        .eco-header {
            background: linear-gradient(90deg, #198754, #39b86f);
            color: #fff;
            padding: 18px;
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            background: #e8f8ec;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
        }

        .icon-circle i {
            font-size: 34px;
            color: #198754;
        }

        .tip-title {
            font-size: 24px;
            font-weight: 700;
            margin-top: 18px;
        }

        .tip-text {
            color: #6c757d;
            line-height: 1.8;
            margin-top: 10px;
        }

        .tip-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        .tip-list li {
            margin-bottom: 12px;
            color: #555;
            font-size: 15px;
        }

        .tip-list i {
            color: #198754;
            margin-right: 10px;
        }

        .learn-btn {
            border-radius: 30px;
            padding: 10px 28px;
            font-weight: 600;
        }

        @media(max-width:768px) {

            .tip-title {
                font-size: 20px;
            }

            .tip-text {
                font-size: 14px;
            }

            .icon-circle {
                width: 60px;
                height: 60px;
            }

            .icon-circle i {
                font-size: 28px;
            }

        }
        body{
    background:#f5f7fb;
}

.form-card{
    max-width:900px;
    margin:40px auto;
    border:none;

    box-shadow:0 8px 20px rgba(0,0,0,.12);

.card-header{

.card-body{

label{

    margin-bottom:6px;
}

.service-box{
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    background:#fafafa;
}

.btn-success{
    padding:10px 25px;
}


</style>

<div class="card form-card">

<div class="card-header">

<div class="card-body">

<form action="" method="POST" enctype="multipart/form-data">

<div class="row">

<!-- Shop Name -->

<div class="col-md-6 mb-3">
<label>Shop Name</label>
<input type="text" class="form-control" name="shop_name" placeholder="RK Computers" required>
</div>

<!-- Owner -->

<div class="col-md-6 mb-3">
<label>Owner Name</label>
<input type="text" class="form-control" name="owner_name" placeholder="Owner Name">
</div>

<!-- Mobile -->

<div class="col-md-6 mb-3">
<label>Mobile Number</label>
<input type="tel" class="form-control" name="mobile" placeholder="9876543210" required>
</div>

<!-- Address -->

<div class="col-md-6 mb-3">
<label>Address</label>
<input type="text" class="form-control" name="address" placeholder="Bramhapuri, Chandrapur">
</div>

<!-- Opening Time -->

<div class="col-md-6 mb-3">
<label>Opening Time</label>
<input type="time" class="form-control" name="opening_time">
</div>

<!-- Closing Time -->

<div class="col-md-6 mb-3">
<label>Closing Time</label>
<input type="time" class="form-control" name="closing_time">
</div>

<!-- Google Map -->

<div class="col-12 mb-3">
<label>Google Map Link</label>
<input type="url" class="form-control" name="google_map"
placeholder="https://maps.google.com/...">
</div>

<!-- Services -->

<div class="col-12 mb-3">

<label>Available Services</label>

<div class="service-box">

<div class="row">

<div class="col-lg-3 col-md-4 col-6">
<div class="form-check">
<input class="form-check-input" type="checkbox" name="services[]" value="Mobile">
<label class="form-check-label">Mobile</label>
</div>
</div>

<div class="col-lg-3 col-md-4 col-6">
<div class="form-check">
<input class="form-check-input" type="checkbox" name="services[]" value="Laptop">
<label class="form-check-label">Laptop</label>
</div>
</div>

<div class="col-lg-3 col-md-4 col-6">
<div class="form-check">
<input class="form-check-input" type="checkbox" name="services[]" value="Battery">
<label class="form-check-label">Battery</label>
</div>
</div>

<div class="col-lg-3 col-md-4 col-6">
<div class="form-check">
<input class="form-check-input" type="checkbox" name="services[]" value="Printer">
<label class="form-check-label">Printer</label>
</div>
</div>

<div class="col-lg-3 col-md-4 col-6">
<div class="form-check">
<input class="form-check-input" type="checkbox" name="services[]" value="Electronics">
<label class="form-check-label">Electronics</label>
</div>
</div>

<div class="col-lg-3 col-md-4 col-6">
<div class="form-check">
<input class="form-check-input" type="checkbox" name="services[]" value="Accessories">
<label class="form-check-label">Accessories</label>
</div>
</div>

</div>

</div>

</div>
